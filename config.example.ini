[server]
host = 127.0.0.1
port = 8090

[huawei]
# App creata su https://developer.huawei.com (Health Kit)
client_id =
client_secret =
# Token OAuth (refresh) dopo autorizzazione utente Huawei ID
refresh_token =
# EU/global Health Kit host
api_base = https://health-api.cloud.huawei.com/healthkit/v2
oauth_token_url = https://oauth-login.cloud.huawei.com/oauth2/v3/token
# Device label in snapshot (GT3 Pro)
device_label = Huawei Watch GT 3 Pro

[sync]
# Minuti tra un pull Health Kit e il successivo
interval_minutes = 15
# Ore di storico da richiedere a polymerize
lookback_hours = 24
